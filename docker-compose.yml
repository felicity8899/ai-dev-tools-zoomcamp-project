# TableNow — one-command local run:  docker compose up
# Observability stack:              docker compose --profile observability up
name: tablenow

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tablenow
      POSTGRES_PASSWORD: tablenow
      POSTGRES_DB: tablenow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tablenow"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://tablenow:tablenow@postgres:5432/tablenow
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: tablenow-backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  # ---- observability profile -------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    profiles: [observability]

  jaeger:
    image: jaegertracing/all-in-one:1.62
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    profiles: [observability]

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    profiles: [observability]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./infra/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    profiles: [observability]

  agent:
    build: ./agent
    environment:
      BACKEND_URL: http://backend:8000
      INCIDENTS_DIR: /incidents
    volumes:
      - ./incidents:/incidents
    ports:
      - "8090:8090"
    depends_on:
      - backend
    profiles: [observability]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    profiles: [observability]

volumes:
  pgdata:
