global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The backend's /metrics is the source of the join-journey SLO data.
  - job_name: tablenow-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  # Collector-exported metrics (pipeline health).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
